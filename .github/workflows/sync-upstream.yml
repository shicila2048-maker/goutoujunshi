name: Sync Upstream

on:
  schedule:
    - cron: '0 0 */3 * *'  # 每3天同步一次 (UTC 00:00)
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve upstream dynamically
        id: upstream
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to query repository info (HTTP $HTTP_CODE)"
            exit 1
          fi

          UPSTREAM=$(echo "$BODY" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          parent = data.get('parent')
          print(parent['full_name'] if parent else '')
          ")

          echo "upstream=$UPSTREAM" >> $GITHUB_OUTPUT

          if [ -z "$UPSTREAM" ]; then
            echo "has_upstream=false" >> $GITHUB_OUTPUT
            echo "::warning::No upstream parent found — this repository is no longer a fork or upstream was deleted."
          else
            echo "has_upstream=true" >> $GITHUB_OUTPUT
            echo "Upstream repository: $UPSTREAM"
          fi

      - name: Notify if upstream missing
        if: steps.upstream.outputs.has_upstream == 'false'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d '{
              "title": "自动同步已停止：上游仓库不存在",
              "body": "本仓库已无法找到上游 fork 关系。\n\n可能原因：\n- 上游仓库已被删除\n- 本仓库已被转换为独立仓库（unfork）\n- 上游仓库被设为私有且无法访问\n\n自动同步已停止。如需恢复，请手动重新设置上游。",
              "labels": ["sync-stopped"]
            }'
          exit 1

      - name: Fetch and fast-forward sync
        id: sync
        run: |
          UPSTREAM="${{ steps.upstream.outputs.upstream }}"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream main

          if git merge --ff-only upstream/main; then
            git push origin main
            echo "result=success" >> $GITHUB_OUTPUT
            echo "Sync completed successfully from $UPSTREAM"
          else
            echo "result=conflict" >> $GITHUB_OUTPUT
            echo "::warning::Fast-forward merge failed — local history has diverged from upstream."
          fi

      - name: Notify on sync conflict
        if: steps.sync.outputs.result == 'conflict'
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d '{
              "title": "自动同步失败：需要手动处理冲突",
              "body": "上游仓库 `${{ steps.upstream.outputs.upstream }}` 的最新更改无法快进合并。\n\n**原因：** 本仓库存在独立提交，与上游历史产生分歧。\n\n**建议操作：**\n1. 克隆本仓库到本地\n2. 执行 `git fetch upstream && git rebase upstream/main`（或 merge）\n3. 解决冲突后推送\n4. 之后自动同步将恢复正常\n\n也可以选择放弃本地修改，直接强制同步上游：\n```bash\ngit reset --hard upstream/main\ngit push --force\n```",
              "labels": ["sync-failed"]
            }'
          exit 1
